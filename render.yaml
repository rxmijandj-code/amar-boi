services:
  - type: web
    name: amar-boi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api.php?action=session
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
